services:
  uma:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3210:3210"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      IMAGE_GENERATION_API_KEY: ${IMAGE_GENERATION_API_KEY:?set IMAGE_GENERATION_API_KEY}
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:?set BROWSER_WORKER_TOKEN}
      UMA_OAUTH_REDIRECTS: ${UMA_OAUTH_REDIRECTS:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      UMA_LOG_LEVEL: ${UMA_LOG_LEVEL:-info}
      UMA_TELEMETRY_DIR: /data/telemetry
      UMA_XIANYU_ADMIN_PASSWORD_HASH: ${UMA_XIANYU_ADMIN_PASSWORD_HASH:?set UMA_XIANYU_ADMIN_PASSWORD_HASH}
      UMA_XIANYU_CONTROL_TOKEN: ${UMA_XIANYU_CONTROL_TOKEN:?set UMA_XIANYU_CONTROL_TOKEN}
    volumes:
      - uma-state:/data/state
      - uma-telemetry:/data/telemetry
      - ./workspace:/data/workspace
    depends_on:
      browser-worker:
        condition: service_healthy
    networks:
      - default

  xianyu-adapter:
    build:
      context: .
      dockerfile: docker/Dockerfile.xianyu
    init: true
    restart: unless-stopped
    environment:
      UMA_XIANYU_CONTROL_TOKEN: ${UMA_XIANYU_CONTROL_TOKEN:?set UMA_XIANYU_CONTROL_TOKEN}
    volumes:
      - xianyu-state:/data/xianyu
      - ./docker/config.user.json:/run/uma/config.user.json:ro
    expose:
      - "3250"
    depends_on:
      uma:
        condition: service_healthy

  browser-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.browser
    init: true
    restart: unless-stopped
    environment:
      BROWSER_WORKER_HOST: 0.0.0.0
      BROWSER_WORKER_PORT: 3230
      BROWSER_WORKER_AUTH_TOKEN: ${BROWSER_WORKER_TOKEN:?set BROWSER_WORKER_TOKEN}
      UMA_TELEMETRY_DIR: /data/telemetry
    volumes:
      - uma-telemetry:/data/telemetry
    expose:
      - "3230"


volumes:
  uma-state:
  uma-telemetry:
  xianyu-state:

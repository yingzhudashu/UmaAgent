services:
  uma:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3210:3210"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:?set BROWSER_WORKER_TOKEN}
      FEISHU_MCP_TOKEN: ${FEISHU_MCP_TOKEN:-}
      SKILL_WORKER_TOKEN: ${SKILL_WORKER_TOKEN:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      UMA_LOG_LEVEL: ${UMA_LOG_LEVEL:-info}
    volumes:
      - uma-state:/data/state
      - ./workspace:/data/workspace
    depends_on:
      browser-worker:
        condition: service_healthy
    networks:
      - default
      - skill-network

  browser-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.browser
    init: true
    restart: unless-stopped
    environment:
      BROWSER_WORKER_HOST: 0.0.0.0
      BROWSER_WORKER_PORT: 3230
      BROWSER_WORKER_AUTH_TOKEN: ${BROWSER_WORKER_TOKEN:?set BROWSER_WORKER_TOKEN}
    expose:
      - "3230"

  feishu-adapter:
    profiles: ["feishu"]
    build:
      context: .
      dockerfile: docker/Dockerfile.feishu
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3220:3220"
    environment:
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      FEISHU_ALLOWED_OPEN_IDS: ${FEISHU_ALLOWED_OPEN_IDS:-}
      UMA_SERVER_URL: http://uma:3210
      UMA_TOKEN: ${UMA_TOKEN:?set UMA_TOKEN}
      FEISHU_STATE_DIR: /data/feishu
      FEISHU_HOST: 0.0.0.0
      FEISHU_PORT: 3220
    volumes:
      - feishu-state:/data/feishu
    depends_on:
      uma:
        condition: service_healthy

  feishu-mcp:
    profiles: ["feishu-tools"]
    build:
      context: .
      dockerfile: docker/Dockerfile.feishu-mcp
    init: true
    restart: unless-stopped
    environment:
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_MCP_HOST: 0.0.0.0
      FEISHU_MCP_PORT: 3240
      FEISHU_MCP_AUTH_TOKEN: ${FEISHU_MCP_TOKEN:-}
      UMA_SERVER_URL: http://uma:3210
      UMA_TOKEN: ${UMA_TOKEN:?set UMA_TOKEN}
    expose:
      - "3240"
    depends_on:
      uma:
        condition: service_started

  skill-worker:
    profiles: ["skills"]
    build:
      context: .
      dockerfile: docker/Dockerfile.skill-worker
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    environment:
      SKILL_WORKER_HOST: 0.0.0.0
      SKILL_WORKER_PORT: 3250
      SKILL_WORKER_AUTH_TOKEN: ${SKILL_WORKER_TOKEN:-}
      SKILL_WORKER_PACKAGES_DIR: /skills
      SKILL_WORKER_ALLOWED_HASHES: ${SKILL_WORKER_ALLOWED_HASHES:-}
    volumes:
      - ./approved-skills:/skills:ro
      - skill-scratch:/scratch
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - "3250"
    networks:
      - skill-network

volumes:
  uma-state:
  feishu-state:
  skill-scratch:

networks:
  skill-network:
    internal: true

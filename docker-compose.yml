services:
  uma:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3210:3210"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:?set BROWSER_WORKER_TOKEN}
      UMA_OAUTH_REDIRECTS: ${UMA_OAUTH_REDIRECTS:-}
      SKILL_WORKER_TOKEN: ${SKILL_WORKER_TOKEN:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      UMA_LOG_LEVEL: ${UMA_LOG_LEVEL:-info}
      UMA_TELEMETRY_DIR: /data/telemetry
      UMA_XIANYU_ADMIN_PASSWORD_HASH: ${UMA_XIANYU_ADMIN_PASSWORD_HASH:?set UMA_XIANYU_ADMIN_PASSWORD_HASH}
      UMA_XIANYU_CONTROL_TOKEN: ${UMA_XIANYU_CONTROL_TOKEN:?set UMA_XIANYU_CONTROL_TOKEN}
    volumes:
      - uma-state:/data/state
      - uma-telemetry:/data/telemetry
      - ./workspace:/data/workspace
    depends_on:
      browser-worker:
        condition: service_healthy
    networks:
      - default
      - skill-network

  xianyu-adapter:
    build:
      context: .
      dockerfile: docker/Dockerfile.xianyu
    init: true
    restart: unless-stopped
    environment:
      UMA_XIANYU_CONTROL_TOKEN: ${UMA_XIANYU_CONTROL_TOKEN:?set UMA_XIANYU_CONTROL_TOKEN}
    volumes:
      - xianyu-state:/data/xianyu
      - ./docker/config.user.json:/run/uma/config.user.json:ro
    expose:
      - "3250"
    depends_on:
      uma:
        condition: service_healthy

  browser-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.browser
    init: true
    restart: unless-stopped
    environment:
      BROWSER_WORKER_HOST: 0.0.0.0
      BROWSER_WORKER_PORT: 3230
      BROWSER_WORKER_AUTH_TOKEN: ${BROWSER_WORKER_TOKEN:?set BROWSER_WORKER_TOKEN}
      UMA_TELEMETRY_DIR: /data/telemetry
    volumes:
      - uma-telemetry:/data/telemetry
    expose:
      - "3230"

  skill-worker:
    profiles: ["skills"]
    build:
      context: .
      dockerfile: docker/Dockerfile.skill-worker
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    environment:
      SKILL_WORKER_HOST: 0.0.0.0
      SKILL_WORKER_PORT: 3250
      SKILL_WORKER_AUTH_TOKEN: ${SKILL_WORKER_TOKEN:-}
      SKILL_WORKER_PACKAGES_DIR: /skills
      SKILL_WORKER_ALLOWED_HASHES: ${SKILL_WORKER_ALLOWED_HASHES:-}
    volumes:
      - ./approved-skills:/skills:ro
      - skill-scratch:/scratch
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - "3250"
    networks:
      - skill-network

volumes:
  uma-state:
  uma-telemetry:
  xianyu-state:
  skill-scratch:

networks:
  skill-network:
    internal: true

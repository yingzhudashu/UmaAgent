l="#17212B" font-weight="400">会话设置</text><text x="252" y="70" font-size="20" fill="#17212B" font-weight="600">UM-05 对话输入与附件草稿</text><text x="1398" y="69" font-size="22" fill="#365F45" font-weight="400">⋯</text><text x="252" y="100" font-size="13" fill="#52616E" font-weight="400">对话输入与附件草稿 · 当前示例仅供布局验收</text><rect x="350.0" y="144" width="960" height="46" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="362.0" y="172" font-size="13" fill="#17212B" font-weight="400">工作模式：Agent</text><rect x="350.0" y="202" width="960" height="46" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="362.0" y="230" font-size="13" fill="#17212B" font-weight="400">附件：research.pdf · 上传完成</text><text x="366.0" y="340" font-size="20" fill="#17212B" font-weight="600">草稿尚未发送</text><text x="366.0" y="372" font-size="14" fill="#52616E" font-weight="400">确认输入后点击发送，不生成虚假回执。</text><rect x="350.0" y="694" width="960" height="80" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><text x="364.0" y="725" font-size="14" fill="#17212B" font-weight="400">请按主题总结这三份资料。</text><rect x="250" y="798" width="1160" height="72" rx="0" fill="#F5F3ED" stroke="#F5F3ED"/><rect x="252" y="808" width="64" height="44" rx="8" fill="#365F45" stroke="#7B8A98"/><text x="268" y="836" font-size="14" fill="#FFFFFF" font-weight="400">发送</text><rect x="328" y="808" width="96" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="344" y="836" font-size="14" fill="#17212B" font-weight="400">添加附件</text><text x="444" y="836" font-size="14" fill="#365F45" font-weight="400">更多操作 ▾</text><text x="252" y="880" font-size="12" fill="#52616E" font-weight="400">设计基线 · 合成示例 · 表单与状态以本页规则为准</text></svg>
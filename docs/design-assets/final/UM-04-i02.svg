<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img"><title>会话重命名与删除 · 删除会话</title><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style><rect x="0" y="0" width="1440" height="610" rx="0" fill="#F5F3ED" stroke="#7B8A98"/><text x="32" y="40" font-size="23" fill="#17212B" font-weight="600">UM-04.I02  删除会话</text><text x="32" y="70" font-size="14" fill="#52616E" font-weight="400">动作状态图 · 完成与失败是互斥分支；本地动作不等待服务端；失败不是完成后的下一步</text><rect x="32" y="110" width="326" height="440" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><rect x="32" y="110" width="326" height="50" rx="12" fill="#E6EFE7" stroke="#7B8A98"/><text x="48" y="143" font-size="18" fill="#17212B" font-weight="600">操作前</text><text x="48" y="192" font-size="16" fill="#17212B" font-weight="600">会话重命名与删除</text><text x="48" y="228" font-size="12" fill="#52616E" font-weight="400">会话标题</text><rect x="48" y="242" width="294" height="48" rx="8" fill="#F5F3ED" stroke="#7B8A98"/><text x="60" y="272" font-size="13" fill="#17212B" font-weight="400">研究资料梳理</text><text x="48" y="323" font-size="15" fill="#17212B" font-weight="400">用户点删除，确认框展示会话名，默认焦</text><text x="48" y="346" font-size="15" fill="#17212B" font-weight="400">点取消；在线。 按G15确认对象与删除</text><text x="48" y="369" font-size="15" fill="#17212B" font-weight="400">范围；确认前不发送请求。</text><rect x="48" y="482" width="294" height="44" rx="8" fill="#365F45" stroke="#7B8A98"/><text x="64" y="510" font-size="14" fill="#FFFFFF" font-weight="400">删除会话</text><rect x="382" y="110" width="326" height="440" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><rect x="382" y="110" width="326" height="50" rx="12" fill="#E6EFE7" stroke="#7B8A98"/><text x="398" y="143" font-size="18" fill="#17212B" font-weight="600">执行中</text><text x="398" y="192" font-size="16" fill="#17212B" font-weight="600">会话重命名与删除</text><text x="398" y="228" font-size="12" fill="#52616E" font-weight="400">会话标题</text><rect x="398" y="242" width="294" height="48" rx="8" fill="#F5F3ED" stroke="#7B8A98"/><text x="410" y="272" font-size="13" fill="#17212B" font-weight="400">研究资料梳理</text><text x="398" y="323" font-size="15" fill="#17212B" font-weight="400">“删除会话”禁用并显示“处理中…”；</text><text x="398" y="346" font-size="15" fill="#17212B" font-weight="400">本页对象保留，禁止并发重复提交。</text><rect x="398" y="482" width="294" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="414" y="510" font-size="14" fill="#17212B" font-weight="400">处理中…</text><rect x="732" y="110" width="326" height="440" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><rect x="732" y="110" width="326" height="50" rx="12" fill="#E6EFE7" stroke="#7B8A98"/><text x="748" y="143" font-size="18" fill="#17212B" font-weight="600">完成分支</text><text x="748" y="192" font-size="16" fill="#17212B" font-weight="600">会话重命名与删除</text><text x="748" y="228" font-size="12" fill="#52616E" font-weight="400">会话标题</text><rect x="748" y="242" width="294" height="48" rx="8" fill="#F5F3ED" stroke="#7B8A98"/><text x="760" y="272" font-size="13" fill="#17212B" font-weight="400">研究资料梳理</text><text x="748" y="323" font-size="15" fill="#17212B" font-weight="400">确认对象名后删除；成功清除本会话缓存</text><text x="748" y="346" font-size="15" fill="#17212B" font-weight="400">/订阅，选择剩余最近会话或空首页。</text><rect x="748" y="482" width="294" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="764" y="510" font-size="14" fill="#17212B" font-weight="400">完成后保留结果</text><rect x="1082" y="110" width="326" height="440" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><rect x="1082" y="110" width="326" height="50" rx="12" fill="#E6EFE7" stroke="#7B8A98"/><text x="1098" y="143" font-size="18" fill="#17212B" font-weight="600">失败分支</text><text x="1098" y="192" font-size="16" fill="#17212B" font-weight="600">会话重命名与删除</text><text x="1098" y="228" font-size="12" fill="#52616E" font-weight="400">会话标题</text><rect x="1098" y="242" width="294" height="48" rx="8" fill="#F5F3ED" stroke="#7B8A98"/><text x="1110" y="272" font-size="13" fill="#17212B" font-weight="400">研究资料梳理</text><text x="1098" y="323" font-size="15" fill="#17212B" font-weight="400">409运行中时引导先取消或等待；其他错</text><text x="1098" y="346" font-size="15" fill="#17212B" font-weight="400">误保留会话。</text><rect x="1098" y="482" width="294" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="1114" y="510" font-size="14" fill="#17212B" font-weight="400">保留输入 / 查看原因</text><text x="32" y="587" font-size="13" fill="#52616E" font-weight="400">返回/关闭：返回触发页面，恢复原焦点/滚动；未保存输入按G03确认；在途操作不被伪装取消。</text></svg>
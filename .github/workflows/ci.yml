name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 18 * * *"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build:web:embed
      - run: docker build -t uma-agent:ci .
      - run: docker build -f docker/Dockerfile.xianyu -t uma-agent-xianyu:ci .
      - run: docker build -f docker/Dockerfile.browser -t uma-agent-browser:ci .
      - run: docker build -f docker/Dockerfile.skill-worker -t uma-agent-skill-worker:ci .
      - name: Smoke-test containers, persistence, and the Core state lock
        shell: bash
        run: |
          set -euo pipefail
          network=uma-ci-network
          state_volume=uma-ci-state
          telemetry_volume=uma-ci-telemetry
          workspace_volume=uma-ci-workspace
          xianyu_volume=uma-ci-xianyu
          cleanup() {
            docker rm -f uma-core-lock uma-xianyu uma-skill-worker uma-core browser-worker >/dev/null 2>&1 || true
            docker volume rm "$state_volume" "$telemetry_volume" "$workspace_volume" "$xianyu_volume" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          docker network create "$network" >/dev/null
          docker volume create "$state_volume" >/dev/null
          docker volume create "$telemetry_volume" >/dev/null
          docker volume create "$workspace_volume" >/dev/null
          docker volume create "$xianyu_volume" >/dev/null

          wait_healthy() {
            local container=$1
            for _ in $(seq 1 90); do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")
              if [ "$status" = healthy ]; then return 0; fi
              if [ "$status" = exited ] || [ "$status" = unhealthy ]; then
                docker logs "$container"
                return 1
              fi
              sleep 2
            done
            docker logs "$container"
            return 1
          }

          docker run -d --name browser-worker --network "$network" \
            -e BROWSER_WORKER_HOST=0.0.0.0 \
            -e BROWSER_WORKER_PORT=3230 \
            -e BROWSER_WORKER_AUTH_TOKEN=ci-browser-token \
            -e UMA_TELEMETRY_DIR=/data/telemetry \
            -v "$telemetry_volume:/data/telemetry" \
            uma-agent-browser:ci >/dev/null
          wait_healthy browser-worker

          start_core() {
            docker run -d --name uma-core --network "$network" \
              -e UMA_AUTH_TOKEN=ci-core-token \
              -e OPENAI_API_KEY=ci-placeholder-key \
              -e BROWSER_WORKER_TOKEN=ci-browser-token \
              -e UMA_TELEMETRY_DIR=/data/telemetry \
              -v "$state_volume:/data/state" \
              -v "$telemetry_volume:/data/telemetry" \
              -v "$workspace_volume:/data/workspace" \
              uma-agent:ci >/dev/null
            wait_healthy uma-core
          }
          start_core
          docker exec uma-core node -e "fetch('http://127.0.0.1:3210/api/v14/sessions',{method:'POST',headers:{authorization:'Bearer ci-core-token','content-type':'application/json'},body:JSON.stringify({mode:'assistant',title:'CI persistence'})}).then(async r=>{if(!r.ok)throw new Error(await r.text())})"

          docker stop uma-core >/dev/null
          docker rm uma-core >/dev/null
          start_core
          docker exec uma-core node -e "fetch('http://127.0.0.1:3210/api/v14/sessions',{headers:{authorization:'Bearer ci-core-token'}}).then(r=>r.json()).then(items=>{if(!items.some(item=>item.title==='CI persistence'))process.exit(1)})"

          docker create --name uma-core-lock --network "$network" \
            -e UMA_AUTH_TOKEN=ci-core-token \
            -e OPENAI_API_KEY=ci-placeholder-key \
            -e BROWSER_WORKER_TOKEN=ci-browser-token \
            -e UMA_TELEMETRY_DIR=/data/telemetry \
            -v "$state_volume:/data/state" \
            -v "$telemetry_volume:/data/telemetry" \
            -v "$workspace_volume:/data/workspace" \
            uma-agent:ci >/dev/null
          docker start uma-core-lock >/dev/null
          lock_exit=$(docker wait uma-core-lock)
          if [ "$lock_exit" -eq 0 ]; then
            docker logs uma-core-lock
            echo "Second Core unexpectedly acquired the same state directory" >&2
            exit 1
          fi
          docker logs uma-core-lock 2>&1 | grep -q "State directory is already in use"

          docker run -d --name uma-xianyu --network "$network" \
            -e UMA_XIANYU_CONTROL_TOKEN=ci-xianyu-token \
            -v "$xianyu_volume:/data/xianyu" \
            -v "$PWD/docker/ci-config.user.json:/run/uma/config.user.json:ro" \
            uma-agent-xianyu:ci >/dev/null
          wait_healthy uma-xianyu
          docker restart uma-xianyu >/dev/null
          wait_healthy uma-xianyu

          skill_root=/tmp/uma-ci-skills
          mkdir -p "$skill_root/example"
          printf 'export const ping = async () => ({ ok: true });\n' > "$skill_root/example/index.mjs"
          skill_hash=$(node -e "const c=require('node:crypto'),f=require('node:fs');const h=c.createHash('sha256');h.update('index.mjs');h.update(f.readFileSync(process.argv[1]));process.stdout.write(h.digest('hex'))" "$skill_root/example/index.mjs")
          printf '{"name":"example","contentHash":"%s","entry":"index.mjs","tools":[{"name":"ping","description":"health fixture","export":"ping"}]}' "$skill_hash" > "$skill_root/example/skill-worker.json"
          docker run -d --name uma-skill-worker --network "$network" \
            -e SKILL_WORKER_HOST=0.0.0.0 \
            -e SKILL_WORKER_AUTH_TOKEN=ci-skill-token \
            -e SKILL_WORKER_PACKAGES_DIR=/skills \
            -e SKILL_WORKER_ALLOWED_HASHES="$skill_hash" \
            -v "$skill_root:/skills:ro" \
            uma-agent-skill-worker:ci >/dev/null
          wait_healthy uma-skill-worker
      - run: npm run check
      - run: npm test
      - run: npm run test:coverage
      - run: npm run test:eval:faux
      - name: Performance budget smoke
        run: UMA_PERF_MESSAGES=20 UMA_PERF_REQUIRE=1 npm run test:perf
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web:e2e
      - name: Short reliability soak
        if: github.event_name != 'schedule'
        run: UMA_SOAK_HOURS=0.167 UMA_SOAK_MESSAGE_INTERVAL_MS=1000 npm run test:soak:faux

  nightly-soak:
    if: github.event_name == 'schedule'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: UMA_SOAK_HOURS=4 UMA_SOAK_MESSAGE_INTERVAL_MS=5000 npm run test:soak:faux

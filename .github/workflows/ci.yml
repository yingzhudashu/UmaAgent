name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: docker build -t uma-agent:ci .
      - run: docker build -f docker/Dockerfile.feishu -t uma-agent-feishu:ci .
      - run: docker build -f docker/Dockerfile.browser -t uma-agent-browser:ci .
      - run: npm run check
      - run: npm test
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web:e2e
